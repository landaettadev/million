name: Backend CI

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MONGO_CONNECTION_STRING: ${{ secrets.MONGO_CONNECTION_STRING }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore backend/RealEstate.sln

      - name: Build
        run: dotnet build backend/RealEstate.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test backend/RealEstate.Tests/RealEstate.Tests.csproj -c Release --logger "console;verbosity=normal" --no-build

      - name: Performance tests (non-load)
        run: dotnet test backend/RealEstate.Tests.Performance/RealEstate.Tests.Performance.csproj -c Release --logger "console;verbosity=normal" --filter "Category!=LoadTest" --no-build

      - name: Integration tests (run only if Mongo secret provided)
        if: ${{ env.MONGO_CONNECTION_STRING != '' }}
        env:
          USE_LOCAL_MONGO: 'false'
          MONGO_CONNECTION_STRING: ${{ env.MONGO_CONNECTION_STRING }}
          MONGO_DATABASE: realestate_test
          SKIP_INDEXES: 'true'
          REDIS_DISABLED: 'true'
        run: |
          dotnet test backend/RealEstate.Tests.Integration/RealEstate.Tests.Integration.csproj -c Release --logger "console;verbosity=normal" --no-build


