name: Frontend CI

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: ${{ hashFiles('frontend/.eslintrc*') != '' }}
        working-directory: frontend
        run: |
          if [ -f package.json ] && cat package.json | jq -e '.scripts.lint' >/dev/null 2>&1; then npm run lint --if-present; else echo 'no lint script'; fi

      - name: Test
        working-directory: frontend
        run: npm test -- --ci --reporters=default --reporters=jest-junit


