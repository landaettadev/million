services:
  mongodb:
    image: mongo:7.0
    container_name: realestate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: realestate
    volumes:
      - mongodb_data:/data/db
      # Mount entire init directory to avoid file-vs-dir mount issues on Windows
      - ./backend/RealEstate.Infrastructure/Configuration:/docker-entrypoint-initdb.d:ro

volumes:
  mongodb_data:
